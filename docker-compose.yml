version: '3.9'

services:
  bankapi:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - redis
      - mongo
    networks:
      - bank_network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bank_network

  mongo:
    image: mongo:latest
    ports: 
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bank_network     

networks:
  bank_network:
    driver: bridge

volumes:
  redis_data:
  mongo_data:
