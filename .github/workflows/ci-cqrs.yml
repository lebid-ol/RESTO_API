name: ci-cqrs

on:
  push:
    branches: [ "CQRS" ]
  pull_request:
    branches: [ "CQRS" ]
  workflow_dispatch:

concurrency:
  group: ci-cqrs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: self-hosted

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CONFIGURATION: Release
      SOLUTION: BankAccounts.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .NET SDK
        shell: pwsh
        run: dotnet --info

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/*.fsproj','**/*.props','**/*.targets','**/packages.lock.json','**/nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:SOLUTION"

      - name: Build
        shell: pwsh
        run: dotnet build "$env:SOLUTION" -c "$env:CONFIGURATION" --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test "$env:SOLUTION" -c "$env:CONFIGURATION" --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/test_results.trx
          if-no-files-found: ignore

      - name: Publish
        shell: pwsh
        run: dotnet publish "$env:SOLUTION" -c "$env:CONFIGURATION" --no-build -o ./artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./artifacts/publish
          if-no-files-found: warn

  docker:
    name: Docker Build (sanity)
    runs-on: self-hosted
    needs: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker Desktop Linux context
        shell: pwsh
        run: |
          # IMPORTANT: убираем DOCKER_HOST, чтобы не ломал context
          Remove-Item Env:DOCKER_HOST -ErrorAction SilentlyContinue

          docker context ls
          docker context use desktop-linux
          docker version

      - name: Docker build
        shell: pwsh
        run: docker build -t bankaccounts:${{ github.sha }} -f Dockerfile .
