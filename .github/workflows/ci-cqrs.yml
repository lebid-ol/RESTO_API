name: ci-cqrs

on:
  push:
    branches: [ "CQRS" ]
  pull_request:
    branches: [ "CQRS" ]
  workflow_dispatch:

concurrency:
  group: ci-cqrs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CONFIGURATION: Release
      SOLUTION: BankAccounts.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/*.fsproj','**/*.props','**/*.targets','**/packages.lock.json','**/nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $SOLUTION

      - name: Build
        run: dotnet build $SOLUTION -c $CONFIGURATION --no-restore

      - name: Test
        run: dotnet test $SOLUTION -c $CONFIGURATION --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/test_results.trx
          if-no-files-found: ignore

  docker:
    name: Docker Build (debug)
    runs-on: ubuntu-latest
    needs: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug files
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Root files:"
          ls -la
          echo ""
          echo "Searching for Dockerfile:"
          find . -maxdepth 4 -iname "dockerfile" -print

      - name: Docker build
        run: docker build -t bankaccounts:${{ github.sha }} -f Dockerfile .
