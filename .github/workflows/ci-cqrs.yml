name: ci-cqrs

on:
  push:
    branches: ["CQRS"]
  pull_request:
    branches: ["CQRS"]
  workflow_dispatch:

concurrency:
  group: ci-cqrs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      CONFIGURATION: Release
      SOLUTION: BankAccounts.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .NET SDK
        run: dotnet --info

      - name: Check Docker availability
        id: docker_check
        run: |
          $avai
