name: ci-cqrs

on:
  push:
    branches: [ "CQRS" ]
  pull_request:
    branches: [ "CQRS" ]
  workflow_dispatch:

concurrency:
  group: ci-cqrs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: self-hosted

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CONFIGURATION: Release
      SOLUTION: BankAccounts.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .NET SDK
        run: dotnet --info

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/*.fsproj','**/*.props','**/*.targets','**/packages.lock.json','**/nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        run: dotnet build $env:SOLUTION -c $env:CONFIGURATION --no-restore

      - name: Test
        run: dotnet test $env:SOLUTION -c $env:CONFIGURATION --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/test_results.trx
          if-no-files-found: ignore

      - name: Publish
        run: dotnet publish $env:SOLUTION -c $env:CONFIGURATION --no-build -o ./artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./artifacts/publish
          if-no-files-found: warn
