name: ci-cqrs

on:
  push:
    branches: [ "CQRS" ]
  pull_request:
    branches: [ "CQRS" ]
  workflow_dispatch:

concurrency:
  group: ci-cqrs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: self-hosted

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CONFIGURATION: Release
      SOLUTION: BankAccounts.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Вариант А: НЕ ставим .NET, используем установленный на runner
      - name: Check .NET SDK
        run: dotnet --info

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/*.fsproj','**/*.props','**/*.targets','**/packages.lock.json','**/nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $SOLUTION

      - name: Build
        run: dotnet build $SOLUTION -c $CONFIGURATION --no-restore

      - name: Test
        run: dotnet test $SOLUTION -c $CONFIGURATION --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/test_results.trx
          if-no-files-found: ignore

      - name: Publish
        run: dotnet publish $SOLUTION -c $CONFIGURATION --no-build -o ./artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./artifacts/publish
          if-no-files-found: warn

  docker:
    name: Docker Build (sanity)
    runs-on: self-hosted
    needs: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Если Docker на runner не установлен/не доступен — просто пропускаем сборку
      - name: Check Docker
        id: docker_check
        shell: pwsh
        run: |
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            docker version
          } else {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Docker is not installed or not in PATH. Skipping docker build."
          }

      - name: Docker build
        if: steps.docker_check.outputs.available == 'true'
        run: docker build -t bankaccounts:${{ github.sha }} -f Dockerfile .
