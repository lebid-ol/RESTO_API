jobs:
  dotnet:
    name: .NET + Tests + Publish
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_XMLDOC_MODE: skip
      DOTNET_gcServer: "0"
      DOTNET_GCHeapHardLimit: "2147483648"
      CONFIGURATION: Release
      SOLUTION: BankAccounts.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .NET SDK
        run: dotnet --info

      - name: Docker Desktop (required)
        run: |
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) { throw "Docker CLI not found" }
          Remove-Item Env:DOCKER_HOST -ErrorAction SilentlyContinue
          docker context use desktop-linux
          docker info | Out-Null
          docker version

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~\.nuget\packages
            ${{ github.workspace }}\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/*.fsproj','**/*.props','**/*.targets','**/packages.lock.json','**/nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build (low memory)
        run: dotnet build $env:SOLUTION -c $env:CONFIGURATION --no-restore /m:1

      - name: Test (low memory)
        run: dotnet test $env:SOLUTION -c $env:CONFIGURATION --no-build --logger "trx;LogFileName=test_results.trx" -- RunConfiguration.MaxCpuCount=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/test_results.trx
          if-no-files-found: ignore

      - name: Publish
        run: dotnet publish $env:SOLUTION -c $env:CONFIGURATION --no-build -o artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: artifacts/publish
          if-no-files-found: warn

  docker:
    name: Docker build
    runs-on: self-hosted
    needs: dotnet

    defaults:
      run:
        shell: powershell

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_XMLDOC_MODE: skip
      DOTNET_gcServer: "0"
      DOTNET_GCHeapHardLimit: "2147483648"
      CONFIGURATION: Release
      SOLUTION: BankAccounts.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Desktop (required)
        run: |
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) { throw "Docker CLI not found" }
          Remove-Item Env:DOCKER_HOST -ErrorAction SilentlyContinue
          docker context use desktop-linux
          docker info | Out-Null
          docker version

      - name: Docker build
        run: docker build -t bankaccounts:${{ github.sha }} -f Dockerfile .
