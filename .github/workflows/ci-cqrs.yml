name: ci-cqrs

on:
  push:
    branches: [ "master", "CQRS" ]
  pull_request:
    branches: [ "master", "CQRS" ]
  workflow_dispatch:

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    env:
      CONFIGURATION: Release
      SOLUTION: BankAccounts.sln

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore $SOLUTION
      - run: dotnet build $SOLUTION -c $CONFIGURATION --no-restore
      - run: dotnet test  $SOLUTION -c $CONFIGURATION --no-build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: |
          pwd
          ls -la
          test -f Dockerfile && echo "Dockerfile OK"

      - name: Docker build
        working-directory: ${{ github.workspace }}
        run: docker build -t bankaccounts:${{ github.sha }} -f ./Dockerfile .
